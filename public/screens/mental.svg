<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200"><rect width="800" height="1200" fill="#e1efeb"/><rect x="26" y="40" width="748" height="105" rx="22" fill="#fbfcfb"/><text x="52" y="82" font-family="Arial" font-size="27" font-weight="700" fill="#24312b">Mental Wellbeing</text><text x="52" y="111" font-family="Arial" font-size="14" fill="#718078">Mood, reflection, and gentle mental care.</text><rect x="26" y="168" width="748" height="65" rx="28" fill="#e8efeb"/><text x="112" y="207" font-family="Arial" font-size="12" fill="#718078">Overview</text><text x="290" y="207" font-family="Arial" font-size="12" fill="#718078">Journal</text><rect x="398" y="176" width="170" height="49" rx="24" fill="white"/><text x="452" y="207" font-family="Arial" font-size="12" fill="#26342d">Coach</text><text x="666" y="207" font-family="Arial" font-size="12" fill="#718078">Tools</text><rect x="26" y="265" width="748" height="75" rx="17" fill="#dce9df"/><text x="52" y="295" font-family="Arial" font-size="15" fill="#26342d">Advanced wellbeing coaching</text><text x="52" y="318" font-family="Arial" font-size="10" fill="#718078">Your wellbeing context can inform more relevant guidance.</text><rect x="26" y="370" width="748" height="78" rx="17" fill="none" stroke="#c9d9d1"/><text x="52" y="404" font-family="Arial" font-size="14" fill="#26342d">♡  WellMate Coach</text><text x="52" y="425" font-family="Arial" font-size="10" fill="#718078">A calm space to talk through what's on your mind — without judgment.</text><rect x="26" y="475" width="748" height="215" rx="22" fill="#fbfcfb"/><rect x="50" y="500" width="700" height="95" rx="10" fill="#dce7e5"/><text x="66" y="530" font-family="Arial" font-size="10" fill="#718078">You can say anything — even just 'hi'.</text><rect x="50" y="612" width="700" height="45" rx="12" fill="#8ebeb2"/><text x="400" y="640" text-anchor="middle" font-family="Arial" font-size="12" fill="white">➤  Get Support</text><rect x="26" y="720" width="748" height="330" rx="22" fill="#fbfcfb"/><text x="50" y="758" font-family="Arial" font-size="12" fill="#718078">You could start with:</text><g font-family="Arial" font-size="11" fill="#26342d"><rect x="50" y="780" width="700" height="45" rx="10" fill="#eef3f0"/><text x="68" y="808">“Hi”</text><rect x="50" y="838" width="700" height="45" rx="10" fill="#eef3f0"/><text x="68" y="866">“I'm feeling a bit overwhelmed”</text><rect x="50" y="896" width="700" height="45" rx="10" fill="#eef3f0"/><text x="68" y="924">“I just want to talk”</text><rect x="50" y="954" width="700" height="45" rx="10" fill="#eef3f0"/><text x="68" y="982">“I had a long day”</text></g></svg>